name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish to Modrinth and CurseForge
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Write simple release notes
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          curated_notes=".github/release-notes/${tag}.md"
          if [[ -f "$curated_notes" ]]; then
            cp "$curated_notes" release-notes.md
            exit 0
          fi

          if previous_tag=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null); then
            range="${previous_tag}..${tag}"
          else
            range="${tag}"
          fi

          mapfile -t subjects < <(git log --format='%s' "${range}")
          : > release-notes.md
          feature_pattern='^feat(\([^)]*\))?!?:[[:space:]]*'
          fix_pattern='^fix(\([^)]*\))?!?:[[:space:]]*'
          feature_or_fix_pattern='^(feat|fix)(\([^)]*\))?!?:[[:space:]]*'

          write_section() {
            local heading="$1"
            local kind="$2"
            local wrote_heading=false
            local subject

            for subject in "${subjects[@]}"; do
              case "$kind" in
                feature) [[ "$subject" =~ $feature_pattern ]] || continue ;;
                fix) [[ "$subject" =~ $fix_pattern ]] || continue ;;
                change) [[ "$subject" =~ $feature_or_fix_pattern ]] && continue ;;
              esac

              if [[ "$wrote_heading" == false ]]; then
                printf '## %s\n\n' "$heading" >> release-notes.md
                wrote_heading=true
              fi
              subject=$(sed -E 's/^[^:]+:[[:space:]]*//' <<< "$subject")
              printf -- '- %s\n' "$subject" >> release-notes.md
            done

            if [[ "$wrote_heading" == true ]]; then
              printf '\n' >> release-notes.md
            fi
          }

          write_section "New Features" feature
          write_section "Bug Fixes" fix
          write_section "Changes" change

          if [[ ! -s release-notes.md ]]; then
            printf 'No user-facing changes listed.\n' > release-notes.md
          fi

      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f \
            -name 'createarchitect-*.jar' ! -name '*-sources.jar' | sort)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            printf 'Expected exactly one release JAR, found %s\n' "${#jars[@]}" >&2
            exit 1
          fi

          prerelease=()
          lowercase_tag="${GITHUB_REF_NAME,,}"
          if [[ "$lowercase_tag" =~ (alpha|beta|rc|pre) ]]; then
            prerelease=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" "${jars[0]}" \
            --title "Create: Architect ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${prerelease[@]}"

      - name: Publish to Modrinth
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo 'The MODRINTH_TOKEN repository secret is not configured.' >&2
            exit 1
          fi

          tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          version_number="${tag#v}"
          version_type=release
          lowercase_tag="${tag,,}"
          if [[ "$lowercase_tag" == *alpha* ]]; then
            version_type=alpha
          elif [[ "$lowercase_tag" =~ (beta|rc|pre) ]]; then
            version_type=beta
          fi

          mapfile -t jars < <(find build/libs -maxdepth 1 -type f \
            -name 'createarchitect-*.jar' ! -name '*-sources.jar' | sort)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            printf 'Expected exactly one release JAR, found %s\n' "${#jars[@]}" >&2
            exit 1
          fi

          jq -n \
            --arg name "Create: Architect ${tag}" \
            --arg version "$version_number" \
            --arg version_type "$version_type" \
            --rawfile changelog release-notes.md \
            '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              dependencies: [{project_id: "LNytGWDc", dependency_type: "required"}],
              game_versions: ["1.21.1"],
              version_type: $version_type,
              loaders: ["neoforge"],
              featured: false,
              status: "listed",
              project_id: "createarchitect",
              file_parts: ["file"],
              primary_file: "file"
            }' > modrinth-version.json

          curl --fail-with-body --request POST \
            --header "Authorization: $MODRINTH_TOKEN" \
            --form 'data=@modrinth-version.json;type=application/json' \
            --form "file=@${jars[0]}" \
            'https://api.modrinth.com/v2/version'

      - name: Publish to CurseForge
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [[ -z "$CURSEFORGE_TOKEN" ]]; then
            echo 'The CURSEFORGE_TOKEN repository secret is not configured.' >&2
            exit 1
          fi

          tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          release_type=release
          lowercase_tag="${tag,,}"
          if [[ "$lowercase_tag" == *alpha* ]]; then
            release_type=alpha
          elif [[ "$lowercase_tag" =~ (beta|rc|pre) ]]; then
            release_type=beta
          fi

          mapfile -t jars < <(find build/libs -maxdepth 1 -type f \
            -name 'createarchitect-*.jar' ! -name '*-sources.jar' | sort)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            printf 'Expected exactly one release JAR, found %s\n' "${#jars[@]}" >&2
            exit 1
          fi

          jq -n \
            --arg display_name "Create: Architect ${tag}" \
            --arg release_type "$release_type" \
            --rawfile changelog release-notes.md \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $display_name,
              gameVersionNames: ["1.21.1", "NeoForge", "Client", "Server"],
              releaseType: $release_type,
              relations: {
                projects: [{slug: "create", type: "requiredDependency"}]
              }
            }' > curseforge-metadata.json

          curl --fail-with-body --request POST \
            --header "X-Api-Token: $CURSEFORGE_TOKEN" \
            --form 'metadata=@curseforge-metadata.json;type=application/json' \
            --form "file=@${jars[0]}" \
            'https://minecraft.curseforge.com/api/projects/1718628/upload-file'
